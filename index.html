<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#04050c">
  <title>STUPID LIST</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04050c}
    body{font-family:Arial,sans-serif;color:white}
    #app{width:100%;height:100dvh;border:0;display:block;background:#04050c}
    #setup{
      display:none;min-height:100vh;padding:30px 22px;background:#04050c;
      color:#fff;line-height:1.5
    }
    #setup h1{margin:0 0 12px}
    #setup code{color:#c5ff45;word-break:break-all}
  </style>
</head>
<body>

<div id="setup">
  <h1>STUPID LIST</h1>
  <p>Falta configurar a URL do Google Apps Script.</p>
  <p>Abra este <code>index.html</code> e troque o valor de <code>APP_SCRIPT_URL</code>.</p>
</div>

<iframe
  id="app"
  title="STUPID LIST"
  allow="clipboard-write; web-share"
></iframe>

<script>
/*
  COLE A URL /exec DO SEU GOOGLE APPS SCRIPT AQUI.
  Você só precisa alterar esta linha UMA VEZ.
*/
const APP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwLJJn8MV91PqAr_9ycI3k5WbUdQR9Td_bOr1syXn75w5IH6iLMCZvFce6ep29YOWPmxw/exec';

(function boot(){
  const clean = String(APP_SCRIPT_URL || '').trim();

  if (!clean || clean.includes('COLE_AQUI')) {
    document.getElementById('app').style.display = 'none';
    document.getElementById('setup').style.display = 'block';
    return;
  }

  const current = new URL(location.href);
  const target = new URL(clean);

  const page = String(current.searchParams.get('page') || '').toLowerCase();

  // Admin e check-in abrem direto no Apps Script.
  // O PIN e a autenticação nunca ficam no GitHub.
  if (page === 'admin' || page === 'checkin') {
    target.searchParams.set('page', page);
    location.replace(target.toString());
    return;
  }

  // Lista geral ou lista/drop específica.
  const list = current.searchParams.get('list');

  if (list) {
    target.searchParams.set('list', list);
  }

  document.getElementById('app').src = target.toString();
})();
</script>
</body>
</html>
